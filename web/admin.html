<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetSafe Plants · Admin</title>
<style>body{margin:0;background:#0d2119;color:#e8efdf;font:16px/1.5 system-ui,sans-serif}main{max-width:620px;margin:7vh auto;padding:24px}h1{font:32px Georgia,serif}section{background:#183328;border:1px solid #496c52;border-radius:14px;padding:22px;margin:18px 0}label{display:block;margin:15px 0}input[type=password],input[type=number]{box-sizing:border-box;width:100%;padding:11px;border:1px solid #8eac91;border-radius:7px;background:#0e241b;color:white;font:inherit}button{padding:11px 18px;border:0;border-radius:7px;background:#a8c89e;color:#10261b;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats div{padding:12px;background:#10291f;border-radius:8px}.stats strong{display:block;font-size:22px}.stats span{color:#b6cbb5;font-size:13px}.error{color:#ffc0a7}small{color:#a9bfab}[hidden]{display:none!important}</style></head>
<body><main><h1>PetSafe Plants admin</h1><p id="message" role="status"></p>
<section id="login"><form id="login-form"><label>Admin password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section>
<div id="dashboard" hidden><section><h2>Usage</h2><div id="stats" class="stats"></div><small>Last 24 hours uses a rolling window. Cost is an estimate from reported Muse tokens and successful SAM image requests.</small></section>
<section><h2>Meta API controls</h2><form id="settings-form"><label><input id="enabled" type="checkbox"> Enable Meta API calls</label><label>Maximum calls per rolling 24 hours<input id="limit" type="number" min="0" max="1000000" required></label><button>Save settings</button></form></section><button id="logout">Sign out</button></div></main>
<script>
const $=id=>document.getElementById(id);
async function api(path,options={}){const response=await fetch('/admin/api/'+path,{credentials:'same-origin',...options});const data=await response.json();if(!response.ok)throw Error(data.detail||'Request failed');return data}
function render(data){$('login').hidden=true;$('dashboard').hidden=false;$('enabled').checked=data.enabled;$('limit').value=data.daily_limit;const rows=[['Investigations',data.investigations],['Muse Spark calls',data.spark],['SAM calls',data.sam],['Estimated cost (USD)',data.estimated_cost_usd]];$('stats').replaceChildren(...rows.map(([label,value])=>{const box=document.createElement('div');const title=document.createElement('span');title.textContent=label;const total=document.createElement('strong');total.textContent=label.startsWith('Estimated')?'$'+value.total.toFixed(4):value.total;const recent=document.createElement('span');recent.textContent='Last 24h: '+(label.startsWith('Estimated')?'$'+value.last_24h.toFixed(4):value.last_24h);box.append(title,total,recent);return box}));const quota=document.createElement('div');quota.innerHTML='<span>Remaining daily quota</span>';const count=document.createElement('strong');count.textContent=data.remaining+' / '+data.daily_limit;quota.append(count);$('stats').append(quota)}
async function refresh(){try{render(await api('stats'))}catch{$('login').hidden=false;$('dashboard').hidden=true}}
$('login-form').onsubmit=async event=>{event.preventDefault();try{await api('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});$('password').value='';$('message').textContent='';await refresh()}catch(error){$('message').textContent=error.message;$('message').className='error'}};
$('settings-form').onsubmit=async event=>{event.preventDefault();try{render(await api('settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:$('enabled').checked,daily_limit:Number($('limit').value)})}));$('message').textContent='Settings saved';$('message').className=''}catch(error){$('message').textContent=error.message;$('message').className='error'}};
$('logout').onclick=async()=>{await api('logout',{method:'POST'});$('dashboard').hidden=true;$('login').hidden=false};refresh();
</script></body></html>
